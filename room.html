<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPG Character Portfolio</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="portfolio">
      <section class="character-area" aria-label="캐릭터 메뉴">
        <div class="scene-frame">
        <img
          class="character-scene"
          src="./assets/rpg-scene.png"
          alt="보라색 단발머리와 동그란 철테 안경, 검은 후드티, 흰색 삼선 트레이닝 바지를 입은 도트 캐릭터"
        />

        <img class="character-blink" src="./assets/character-blink.png" alt="" aria-hidden="true" />

        <button
          class="hotspot hotspot-career"
          type="button"
          data-page="career"
          aria-label="경력 및 활동"
          title="경력 및 활동"
        ><span class="hotspot-caption">경력 및 활동</span></button>

        <button
          class="hotspot hotspot-projects"
          type="button"
          data-page="projects"
          aria-label="포트폴리오 보기"
          title="포트폴리오 보기"
        ><span class="hotspot-caption">포트폴리오 보기</span></button>

        <button
          class="hotspot hotspot-contact"
          type="button"
          data-page="contact"
          aria-label="연락처 보기"
          title="연락처 보기"
        ><span class="hotspot-caption">연락처 보기</span></button>
        </div>

        <nav class="mobile-menu" aria-label="포트폴리오 메뉴">
          <button class="hotspot mobile-menu-button" type="button" data-page="career">경력 및 활동</button>
          <button class="hotspot mobile-menu-button" type="button" data-page="projects">포트폴리오 보기</button>
          <button class="hotspot mobile-menu-button" type="button" data-page="contact">연락처 보기</button>
        </nav>
      </section>

      <section class="info-window">
        <div class="window-titlebar">
          <span>✦ ABOUT ME</span>
          <button
            id="closeWindow"
            class="close-button"
            type="button"
            aria-label="정보 닫기"
          >
            ×
          </button>
        </div>

        <div class="window-content">
          <h1 id="pageTitle">안녕하세요!</h1>
          <div id="pageContent">
            <h2>신입 프론트엔드 개발자 000입니다.</h2>
            <p>
              좋아하는 것을 꾸준히 공부하며,<br />
              하나씩 만들어가는 개발자가 되고 싶습니다.
            </p>

            <div class="profile-list">
              <p><strong>이름</strong><span>000</span></p>
              <p><strong>분야</strong><span>Frontend Developer</span></p>
              <p><strong>관심 분야</strong><span>웹 개발, UI/UX, 인터랙션</span></p>
              <p><strong>한마디</strong><span>꾸준히 공부하고 즐겁게 개발하고 싶습니다.</span></p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="./move.js"></script>
  </body>
</html>
