<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#211b31" />
    <title>To my Portfolio</title>
    <link rel="stylesheet" href="./reset.css" />
    <style>
      :root { color-scheme: dark; --lavender: #c6b6eb; }
      body {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow-x: clip;
        padding: 24px 16px;
        color: var(--lavender);
        background: #211b31;
        font-family: "Courier New", "Malgun Gothic", monospace;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: linear-gradient(#191522d9, #211b31ee), url("./assets/rpg-scene.png") center / cover;
      }
      .desk-scene {
        position: relative;
        isolation: isolate;
        width: min(660px, calc(100vw - 32px), calc(88svh / 1.1));
        aspect-ratio: 1 / 1.1;
      }
      .desk-scene::after {
        content: "";
        position: absolute;
        z-index: -1;
        inset: 80% -8% -4%;
        border-top: 3px solid #8c7180;
        border-radius: 4px;
        background: repeating-linear-gradient(0deg, #0000 0 15px, #33233044 16px 17px), #69505a;
        box-shadow: 0 25px 45px #0007;
      }
      .crt {
        position: relative;
        z-index: 2;
        width: 100%;
        aspect-ratio: 1.13;
        border: 3px solid #4d3946;
        border-radius: 8% 7% 7% 8% / 6% 6% 8% 8%;
        background: linear-gradient(120deg, #c2ada3, #aa948f 55%, #bea79d);
        box-shadow: inset 3px 4px #e5d0b777, inset -5px -5px #725e6977, 0 18px 35px #0008;
        transform-origin: 50% 43%;
      }
      .screen {
        position: absolute;
        inset: 10% 9% 20%;
        overflow: hidden;
        border: clamp(7px, 2vw, 15px) solid #353039;
        border-radius: 7% / 9%;
        background: radial-gradient(ellipse at center, #20202b, #101017 80%);
        box-shadow: 0 0 0 3px #70636a, inset 0 0 28px #000;
      }
      .screen::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(0deg, #0002 0 1px, transparent 1px 4px);
      }
      .cat-symbol {
        position: absolute;
        top: 12%;
        left: 50%;
        width: 18%;
        transform: translateX(-50%);
        fill: none;
        stroke: #9c85b3;
        stroke-width: 3;
        shape-rendering: crispEdges;
      }
      .power-button {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 1;
        display: grid;
        place-items: center;
        width: clamp(48px, 11vw, 68px);
        height: clamp(48px, 11vw, 68px);
        transform: translate(-50%, -50%);
        border: 2px solid #d8c7ff;
        border-radius: 50%;
        color: #eee4ff;
        background: #88759f66;
        box-shadow: 0 0 10px #c6a7ff88;
        animation: power-glow 2s ease-in-out infinite;
        text-decoration: none;
      }
      .power-button svg { width: 56%; height: 56%; fill: none; stroke: currentColor; stroke-width: 2; }
      .power-button:hover { background: #b194df88; }
      .power-button:focus-visible { outline: 3px solid #fff; outline-offset: 7px; }
      .start-label {
        position: absolute;
        top: 74%;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: clamp(11px, 2.4vw, 18px);
        letter-spacing: .09em;
        text-shadow: 0 0 8px #c6a7ff55;
      }
      .sticky-note {
        position: absolute;
        right: -1%;
        top: -1%;
        width: 24%;
        padding: 4% 2%;
        transform: rotate(5deg);
        color: #4c3a35;
        background: #e0c49d;
        box-shadow: 3px 4px #49384666;
        font-size: clamp(8px, 1.65vw, 12px);
        font-weight: bold;
        line-height: 1.6;
        text-align: center;
      }
      .sticky-note::before { content: ""; position: absolute; top: -6%; left: 43%; width: 14%; height: 16%; background: #a59086aa; }
      .bezel-power {
        position: absolute;
        bottom: 4%;
        left: 50%;
        width: 8%;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        transform: translateX(-50%);
        border: 2px solid #796169;
        border-radius: 50%;
        color: #534452;
        background: #ccb3a2;
        box-shadow: inset 1px 1px #ead8bd;
      }
      .bezel-power svg { width: 65%; fill: none; stroke: currentColor; stroke-width: 2; }
      .sticker { position: absolute; bottom: 4%; font-size: clamp(20px, 5vw, 40px); line-height: 1; }
      .sticker-cat { left: 8%; width: 8%; height: auto; fill: #6f567e; stroke: #c7a9cd; stroke-width: 2; }
      .sticker-heart { right: 7%; color: #aa718f; text-shadow: 1px 2px #70506c; }
      .stand {
        position: absolute;
        z-index: 0;
        top: 73%;
        left: 31%;
        width: 38%;
        height: 18%;
        border: 3px solid #5b4551;
        border-radius: 0 0 22% 22%;
        background: linear-gradient(#7d6b74, #ad9691);
      }
      .keyboard {
        position: absolute;
        z-index: 3;
        left: 34%;
        bottom: 0;
        width: 45%;
        height: 11%;
        padding: 1.4%;
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 4%;
        border: 3px solid #77606a;
        border-radius: 5px;
        background: #bca498;
        transform: perspective(220px) rotateX(18deg);
        box-shadow: 0 5px #55414e;
      }
      .keyboard span { border: 1px solid #91797c; border-radius: 2px; background: #d6beaa; box-shadow: 0 1px #6e5865; }
      .keyboard span:last-child { grid-column: 3 / 8; }
      .clock {
        position: absolute;
        z-index: 3;
        bottom: 0;
        left: 2%;
        width: 27%;
        padding: 2%;
        border: 5px solid #69515f;
        border-radius: 10px;
        color: #b3b990;
        background: #24232b;
        box-shadow: 3px 4px #382a38;
        font-size: clamp(9px, 2vw, 16px);
        text-align: center;
      }
      .books { position: absolute; bottom: 16%; left: -3%; width: 20%; transform: rotate(-6deg); }
      .books span { display: block; padding: 3% 8%; border: 2px solid #665064; border-radius: 3px; color: #5c4860; background: #d2b9b4; font-size: clamp(8px, 1.7vw, 12px); font-weight: bold; box-shadow: inset 0 -3px #ac90a4; }
      .mouse { position: absolute; right: 3%; bottom: 1%; width: 12%; height: 10%; border: 2px solid #6a5462; border-radius: 55% 55% 45% 45%; background: linear-gradient(90deg, #cbbba5 49%, #8c7379 50%, #c3af9e 52%); transform: rotate(-12deg); box-shadow: 3px 4px #34223466; }
      .is-booting .crt { animation: monitor-boot 600ms ease-in forwards; }
      .is-booting .power-button { animation: none; background: #c6b6eb99; }
      .is-booting .screen { filter: brightness(1.25); }
      @keyframes power-glow {
        0%, 100% { opacity: .68; box-shadow: 0 0 8px #c6a7ff66, 0 0 0 0 #c6a7ff33; }
        50% { opacity: 1; box-shadow: 0 0 24px #c6a7ffbb, 0 0 0 7px #c6a7ff11; }
      }
      @keyframes monitor-boot {
        0% { transform: scale(1); opacity: 1; }
        75% { transform: scale(1.065); opacity: 1; }
        100% { transform: scale(1.08); opacity: 0; }
      }
      @media (max-width: 600px) {
        body { padding: 20px 16px; }
        .desk-scene { width: min(calc(100vw - 48px), calc(85svh / 1.1)); }
        .books { left: -2%; }
        .clock { border-width: 3px; border-radius: 6px; }
        .keyboard { gap: 3%; border-width: 2px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .power-button, .is-booting .crt { animation: none; }
        .power-button { opacity: 1; }
      }
      @media (max-height: 360px) {
        .cat-symbol { display: none; }
        .power-button { width: 48px; height: 48px; }
        .start-label { top: 82%; font-size: 11px; }
      }
      @media (max-height: 280px) {
        .start-label { display: none; }
      }

      /* Foreground desk accessories, kept separate from the monitor and boot effect. */
      .desk-scene { container-type: inline-size; }
      .keyboard {
        left: 30%; bottom: -2%; width: 48%; height: 13%;
        display: flex; flex-direction: column; gap: 3%; padding: 1.5%;
        border: 3px solid #69515c; border-radius: 5px 5px 7px 7px;
        background: linear-gradient(#d0b7a1, #a68b80);
        box-shadow: inset 1px 2px #f4dbc0, inset -2px -3px #80656a, 0 5px #513f4c, 2px 9px 7px #22182f55;
        transform: perspective(350px) rotateX(22deg);
      }
      .keyboard-row { display: flex; gap: 2%; flex: 1; min-height: 0; }
      .keyboard-row span {
        display: flex; align-items: center; justify-content: center;
        flex: 1; min-width: 0; overflow: hidden;
        border: 1px solid #9b7f7b; border-radius: 2px;
        background: linear-gradient(#f0d8bd, #cdb299);
        box-shadow: inset 0 1px #fff1d455, inset 0 -2px #b1958a, 0 1px #745d68;
        color: #65505b; font-size: clamp(4px, 1.2cqw, 8px); font-weight: bold; line-height: 1;
      }
      .keyboard-row span:last-child { grid-column: auto; }
      .keyboard-row .wide { flex: 1.7; }
      .keyboard-row .space { flex: 6.5; }
      .mousepad {
        position: absolute; z-index: 3; right: -5%; bottom: -3%; width: 23%; height: 16%;
        border: 2px solid #9c617a; border-radius: 12% 18% 14% 12%;
        background: linear-gradient(135deg, #d997b5, #bc7b9c);
        box-shadow: inset 1px 1px #f8bfd5, 2px 4px #70445d;
      }
      .pad-sticker { position: absolute; top: 7%; left: 9%; color: #ecb7d0; font-size: clamp(10px, 3cqw, 20px); text-shadow: 1px 1px #915a7a; }
      .mousepad .mouse {
        right: 6%; bottom: 12%; width: 59%; height: 75%;
        border: 2px solid #76606b; border-radius: 50% 50% 44% 44%;
        background: linear-gradient(110deg, #e3d0b9, #c5af9b 65%, #aa8e89);
        transform: rotate(-17deg);
        box-shadow: inset 2px 2px #f1ddc6, inset -2px -3px #a18a83, 3px 5px 3px #5d3a5766;
      }
      .mousepad .mouse::before { content: ""; position: absolute; top: 0; left: 49%; width: 1px; height: 40%; background: #8d7779; }
      .mouse-wheel { position: absolute; top: 10%; left: 44%; width: 13%; height: 17%; border: 1px solid #7b6771; border-radius: 4px; background: repeating-linear-gradient(#a8958b 0 2px, #806e72 2px 3px); }
      .books { z-index: 5; bottom: 14%; left: -5%; width: 22%; transform: rotate(-7deg); }
      .books span {
        padding: 4% 8%; border: 2px solid #665064;
        background: linear-gradient(#ead2c8 0 18%, #c7aaa9 20% 82%, #a88698 84%);
        box-shadow: inset 3px 0 #86677b, inset -3px 0 #ead6c1, 2px 2px #3e304777;
      }
      .books span:nth-child(2) { transform: translateX(4%); }
      .books span:nth-child(3) { transform: translateX(-3%); }
      .books span:nth-child(4) { transform: translateX(3%); }
      .clock {
        z-index: 6; left: 0; bottom: 0; width: 27%; padding: 1.8%;
        border-color: #765d69; background: linear-gradient(#191b22, #292730);
        color: #bdc9a1; font-size: clamp(7px, 1.9cqw, 13px); line-height: 1.65;
        box-shadow: inset 0 0 0 2px #3c3340, 3px 4px #382a38;
        font-variant-numeric: tabular-nums; white-space: nowrap;
      }
      .clock span { display: block; }
      .cocoa-cup {
        position: absolute; z-index: 4; right: -3%; bottom: 19%; width: 12%; height: 12%;
        border: 2px solid #8d657d; border-radius: 12% 12% 30% 30%;
        background: linear-gradient(90deg, #c9a3bf, #ad80a5);
        box-shadow: inset 2px 0 #e3c2d5, 2px 5px #49324755;
      }
      .cocoa-cup::before { content: ""; position: absolute; z-index: -1; right: -32%; top: 17%; width: 44%; height: 54%; border: 4px solid #b991b0; border-radius: 50%; }
      .cocoa-cup::after { content: ""; position: absolute; top: -9%; left: -2%; width: 104%; height: 22%; border: 3px solid #e0c1d3; border-radius: 50%; background: radial-gradient(ellipse, #a47263, #684342 75%); }
      .cup-heart { position: absolute; top: 30%; left: 30%; color: #e4bad1; font-size: clamp(12px, 3.5cqw, 24px); }
      .steam { position: absolute; z-index: 1; bottom: 92%; width: 18%; height: 62%; border-left: 2px solid #eadde0; border-radius: 50%; opacity: 0; animation: cocoa-steam 3.6s ease-out infinite; pointer-events: none; }
      .steam-one { left: 22%; }
      .steam-two { left: 47%; animation-delay: 1.2s; }
      .steam-three { left: 70%; animation-delay: 2.4s; }
      @keyframes cocoa-steam { 0% { transform: translateY(8%) scale(.7); opacity: 0; } 25% { opacity: .6; } 100% { transform: translateY(-75%) scale(1.3); opacity: 0; } }
      @media (max-width: 600px) {
        .books { left: -3%; }
        .keyboard { border-width: 2px; }
        .keyboard-row { gap: 1.5%; }
        .keyboard-row span { border-width: .5px; }
        .mousepad { right: -4%; }
        .cocoa-cup { right: -1%; }
      }
      @media (prefers-reduced-motion: reduce) { .steam { animation: none; opacity: .3; } }
    </style>
  </head>
  <body>
    <main class="desk-scene" aria-label="포트폴리오 시작 화면">
      <div class="stand" aria-hidden="true"></div>
      <section class="crt" aria-label="모니터">
        <div class="screen">
          <svg class="cat-symbol" viewBox="0 0 80 70" aria-hidden="true">
            <path d="M10 35V20H16V7H23V13H29V20H51V13H57V7H64V20H70V35H75V51H69V58H58V63H22V58H11V51H5V35Z" />
            <path d="M25 37V43M55 37V43M35 49H45M40 49V54" />
          </svg>
          <a id="startPortfolio" class="power-button" href="./room.html" aria-label="전원을 켜고 포트폴리오 열기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10M6.4 5.5a9 9 0 1 0 11.2 0" stroke-linecap="round" /></svg>
          </a>
          <p class="start-label">PRESS TO START</p>
        </div>
        <p class="sticky-note">WELCOME TO<br />MY PORTFOLIO<br />:)</p>
        <svg class="sticker sticker-cat" viewBox="0 0 80 70" aria-hidden="true"><path d="M10 35V20H16V7H23V13H29V20H51V13H57V7H64V20H70V35H75V51H69V58H58V63H22V58H11V51H5V35Z" /></svg>
        <span class="bezel-power" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2v10M6.4 5.5a9 9 0 1 0 11.2 0" stroke-linecap="round" /></svg></span>
        <span class="sticker sticker-heart" aria-hidden="true">♥</span>
      </section>
      <div class="books" aria-hidden="true"><span>HTML</span><span>CSS</span><span>JavaScript</span><span>Git &amp; GitHub</span></div>
      <div class="clock" role="img" aria-label="한국 표준시 시계"><span id="clockDate">---- -- --</span><span id="clockTime">-- --:--:--</span></div>
      <div class="keyboard" aria-hidden="true">
        <div class="keyboard-row"><span>Esc</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span><span>-</span><span>=</span><span class="wide">←</span></div>
        <div class="keyboard-row"><span class="wide">Tab</span><span>Q</span><span>W</span><span>E</span><span>R</span><span>T</span><span>Y</span><span>U</span><span>I</span><span>O</span><span>P</span><span>[</span><span>]</span></div>
        <div class="keyboard-row"><span class="wide">Caps</span><span>A</span><span>S</span><span>D</span><span>F</span><span>G</span><span>H</span><span>J</span><span>K</span><span>L</span><span>;</span><span class="wide">Enter</span></div>
        <div class="keyboard-row"><span class="wide">Shift</span><span>Z</span><span>X</span><span>C</span><span>V</span><span>B</span><span>N</span><span>M</span><span>,</span><span>.</span><span>/</span><span class="wide">Shift</span></div>
        <div class="keyboard-row"><span class="wide">Ctrl</span><span>Alt</span><span class="space">SPACE</span><span>Alt</span><span class="wide">Ctrl</span></div>
      </div>
      <div class="mousepad" aria-hidden="true"><span class="pad-sticker">♥</span><div class="mouse"><span class="mouse-wheel"></span></div></div>
      <div class="cocoa-cup" aria-hidden="true"><span class="cup-heart">♥</span><span class="steam steam-one"></span><span class="steam steam-two"></span><span class="steam steam-three"></span></div>
    </main>
    <script>
      const startLink = document.querySelector("#startPortfolio");
      const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");
      let starting = false;
      startLink.addEventListener("click", (event) => {
        if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || event.button !== 0) return;
        event.preventDefault();
        if (starting) return;
        starting = true;
        if (motionPreference.matches) {
          window.location.assign(startLink.href);
          return;
        }
        document.body.classList.add("is-booting");
        startLink.setAttribute("aria-busy", "true");
        window.setTimeout(() => window.location.assign(startLink.href), 600);
      });
      window.addEventListener("pageshow", () => {
        starting = false;
        document.body.classList.remove("is-booting");
        startLink.removeAttribute("aria-busy");
      });

      const koreaClockFormatter = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true,
      });
      function formatKoreanClock(date) {
        const parts = Object.fromEntries(koreaClockFormatter.formatToParts(date).map((part) => [part.type, part.value]));
        return {
          date: `${parts.year}-${parts.month}-${parts.day}`,
          time: `${parts.dayPeriod} ${parts.hour}:${parts.minute}:${parts.second}`,
        };
      }
      function updateKoreanClock() {
        const clock = formatKoreanClock(new Date());
        document.querySelector("#clockDate").textContent = clock.date;
        document.querySelector("#clockTime").textContent = clock.time;
      }
      updateKoreanClock();
      window.setInterval(updateKoreanClock, 1000);
      window.addEventListener("pageshow", updateKoreanClock);
    </script>
  </body>
</html>
